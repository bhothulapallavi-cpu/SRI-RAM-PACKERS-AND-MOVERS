<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Price Estimator - Sri Ram</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5}.c{max-width:480px;margin:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.card{background:#fff;border-radius:14px;padding:16px}label{font-size:13px;font-weight:bold;display:block;margin:12px 0 5px}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px}.tog{display:flex;flex-direction:column;gap:8px}.tog button{border:1px solid #ddd;padding:12px;border-radius:10px;font-weight:bold;background:#fff}.tog button.active{background:#ff6a00;color:#fff;border-color:#ff6a00}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #eee}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:bold;padding:12px 0}.total span:last-child{color:#ff6a00}.btn{width:100%;background:#ff6a00;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:bold}</style></head><body><div class="c">
<a href="index.html" style="font-weight:bold;text-decoration:none;color:#1a3a5c">← Home</a>
<div class="card"><h2>Price Estimator</h2><p style="font-size:12px;color:#666">If we come from another place, Up & Down charge will apply</p>
<label>From</label><input id="from" value="Davanagere"><label>To</label><input id="to" value="Bangalore"><label>Distance (KM)</label><input type="number" id="km" value="270" oninput="calc()">
<label>Home Type</label><select id="home" onchange="calc()"><option value="8000">1 BHK - ₹8,000</option><option value="10000" selected>2 BHK - ₹10,000</option><option value="14000">3 BHK - ₹14,000</option><option value="20000">Office - ₹20,000</option></select>
<label>Trip Type</label><div class="tog"><button id="b1" onclick="setTrip('one')">One Way - Single Journey Only</button><button id="b2" class="active" onclick="setTrip('round')">Round Trip - Up & Down Charge</button></div>
<label><input type="checkbox" id="pack" checked onchange="calc()"> Packing Service - ₹3,000</label><label>Floor</label><select id="floor" onchange="calc()"><option value="0">Ground Floor - Free</option><option value="1000">2nd Floor - ₹1,000</option><option value="3000" selected>3rd Floor No Lift - ₹3,000</option><option value="4500">4th Floor+ - ₹4,500</option></select></div>
<div class="card"><h3>Price Calculation</h3><div class="row"><span>Base Charge</span><b id="pBase"></b></div><div class="row"><span>Packing Charge</span><b id="pPack"></b></div><div class="row"><span>Transport (KM x ₹35)</span><b id="pTrans"></b></div><div class="row"><span>Floor Charge</span><b id="pFloor"></b></div><div class="row" id="rowRet"><span>Return Empty - Up & Down Charge</span><b id="pRet"></b></div><div class="total"><span>Total Estimate</span><span id="pTotal"></span></div><button class="btn" onclick="calc()">🔄 Recalculate</button><br><button class="btn" style="background:#25D366" onclick="location.href='booking.html'">➡️ Book Now</button></div></div>
<script>let trip='round';function setTrip(t){trip=t;document.getElementById('b1').className=t=='one'?'active':'';document.getElementById('b2').className=t=='round'?'active':'';calc()}function f(n){return '₹'+n.toLocaleString('en-IN')}function calc(){let base=+document.getElementById('home').value,km=+document.getElementById('km').value||0,trans=km*35,pack=document.getElementById('pack').checked?3000:0,floor=+document.getElementById('floor').value,ret=trip=='round'?4000:0;document.getElementById('rowRet').style.display=trip=='round'?'flex':'none';let total=base+pack+trans+floor+ret;document.getElementById('pBase').innerText=f(base);document.getElementById('pPack').innerText=f(pack);document.getElementById('pTrans').innerText=f(trans);document.getElementById('pFloor').innerText=f(floor);document.getElementById('pRet').innerText=f(ret);document.getElementById('pTotal').innerText=f(total)}calc()</script></body></html>
