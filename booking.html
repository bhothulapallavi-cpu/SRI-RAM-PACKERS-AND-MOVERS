<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking - Sri Ram</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5}.c{max-width:480px;margin:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.card{background:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}label{font-size:13px;font-weight:bold;margin:10px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px}.btn{width:100%;background:#25D366;color:#fff;border:0;padding:15px;border-radius:12px;font-weight:bold;font-size:16px}</style></head><body><div class="c"><a href="index.html" style="font-weight:bold;text-decoration:none;color:#1a3a5c">← Home</a><div class="card"><h2>📅 Booking Form</h2>
<label>Full Name</label><input id="name" placeholder="Ex: Ramesh"><label>Phone Number</label><input id="phone" placeholder="98765 43210"><label>From</label><input id="from" value="Davanagere"><label>To</label><input id="to" placeholder="Bangalore"><label>Shifting Date</label><input type="date" id="date"><label>Home Type</label><select id="home"><option>1 BHK</option><option selected>2 BHK</option><option>3 BHK</option><option>Office</option></select><label>Notes</label><textarea id="notes" placeholder="Floor, Lift, Packing Required?"></textarea><button class="btn" onclick="book()">📲 Send Booking on WhatsApp</button></div></div>
<script>function book(){let n=document.getElementById('name').value,ph=document.getElementById('phone').value,fr=document.getElementById('from').value,to=document.getElementById('to').value,dt=document.getElementById('date').value,hm=document.getElementById('home').value,nt=document.getElementById('notes').value;let msg=`NEW BOOKING - Sri Ram Packers%0AName: ${n}%0APhone: ${ph}%0AFrom: ${fr} To: ${to}%0ADate: ${dt}%0AHome: ${hm}%0ANotes: ${nt}`;window.open('https://wa.me/919535511166?text='+msg,'_blank')}</script></body></html>
