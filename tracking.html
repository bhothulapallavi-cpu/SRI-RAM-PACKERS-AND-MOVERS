<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracking</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5}.c{max-width:480px;margin:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.card{background:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px}.btn{width:100%;background:#ff6a00;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:bold}.step{display:flex;gap:12px}.dot{width:24px;height:24px;min-width:24px;border-radius:50%;background:#ddd;text-align:center;line-height:24px;font-size:12px}.done{background:#25D366;color:#fff}.active{background:#ff6a00;color:#fff}</style></head><body><div class="c"><a href="index.html" style="font-weight:bold;text-decoration:none;color:#1a3a5c">← Home</a><div class="card"><h2>📍 Live Tracking</h2><p style="font-size:13px;color:#666">Booking ID haki - Ex: SRM123</p><input id="bid" placeholder="Booking ID"><button class="btn" onclick="track()">Track Madu</button><div id="result" style="display:none;flex-direction:column;gap:14px"><div style="background:#e8f5e9;padding:12px;border-radius:10px"><b>Truck: KA-17-AB-1234</b><br><span style="font-size:13px">Davanagere → Bangalore | Driver: Manju</span></div><div class="step"><div class="dot done">✓</div><div><b>Booking Confirmed</b></div></div><div class="step"><div class="dot done">✓</div><div><b>Packing Started</b></div></div><div class="step"><div class="dot active">●</div><div><b>On The Way</b><br><span style="font-size:12px;color:#666">Chitradurga Cross - 40 KM Baki</span></div></div><div class="step"><div class="dot">○</div><div><b>Delivered - Bangalore</b></div></div></div></div></div><script>function track(){if(document.getElementById('bid').value==''){alert('Booking ID haki!');return}document.getElementById('result').style.display='flex'}</script></body></html>
